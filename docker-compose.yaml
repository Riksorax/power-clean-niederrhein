services:
  # Service-Namen bewusst eindeutig (nicht "frontend"/"api") - "traefik-proxy" ist ein geteiltes,
  # externes Netzwerk über mehrere Projekte hinweg, Docker's eingebettetes DNS löst gleichnamige
  # Compose-Service-Namen dort projektübergreifend auf (führte zu zufälligem 404 durch Auflösung
  # auf den falschen Container eines anderen Projekts, siehe Commit-Historie). Aus demselben Grund
  # auch die Traefik-Router-/Service-Namen in den Labels eindeutig gehalten.
  power-clean-frontend:
    image: ${DOCKERHUB_USERNAME:-riksorax}/power-clean-frontend:latest
    container_name: power-clean-frontend
    environment:
      - API_URL=http://power-clean-api:8080
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
    restart: unless-stopped
    depends_on:
      - power-clean-api
    networks:
      - traefik-proxy
    labels:
      - "traefik.enable=true"

      # HTTPS - Hauptdomain
      - "traefik.http.routers.power-clean-frontend.rule=Host(`powercleanniederrhein.de`)"
      - "traefik.http.routers.power-clean-frontend.entrypoints=websecure"
      - "traefik.http.routers.power-clean-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.power-clean-frontend.priority=20"
      - "traefik.http.services.power-clean-frontend.loadbalancer.server.port=3000"

      # HTTPS - www → non-www Redirect
      - "traefik.http.routers.power-clean-frontend-www.rule=Host(`www.powercleanniederrhein.de`)"
      - "traefik.http.routers.power-clean-frontend-www.entrypoints=websecure"
      - "traefik.http.routers.power-clean-frontend-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.power-clean-frontend-www.middlewares=power-clean-redirect-www"

      # HTTP - beides auf HTTPS umleiten
      - "traefik.http.routers.power-clean-frontend-web.rule=Host(`powercleanniederrhein.de`) || Host(`www.powercleanniederrhein.de`)"
      - "traefik.http.routers.power-clean-frontend-web.entrypoints=web"
      - "traefik.http.routers.power-clean-frontend-web.middlewares=power-clean-https-redirect"

      # Middlewares
      - "traefik.http.middlewares.power-clean-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.power-clean-redirect-www.redirectregex.regex=^https://www\\.(.*)"
      - "traefik.http.middlewares.power-clean-redirect-www.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.power-clean-redirect-www.redirectregex.permanent=true"

  power-clean-api:
    image: ${DOCKERHUB_USERNAME:-riksorax}/power-clean-api:latest
    container_name: power-clean-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - AllowedOrigins=https://powercleanniederrhein.de
      - SmtpSettings__Host=${SMTP_HOST}
      - SmtpSettings__Port=${SMTP_PORT}
      - SmtpSettings__Username=${SMTP_USERNAME}
      - SmtpSettings__Password=${SMTP_PASSWORD}
      - SmtpSettings__FromEmail=${SMTP_FROM_EMAIL}
      - SmtpSettings__ToEmail=${SMTP_TO_EMAIL}
      - UniversalCms__BaseUrl=https://cms.webappniederrhein.de
      - UniversalCms__ApiKey=${UNIVERSALCMS_API_KEY}
      - UniversalCms__ProjectSlug=powercleanniederrhein
    restart: unless-stopped
    networks:
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.power-clean-api.rule=Host(`powercleanniederrhein.de`) && PathPrefix(`/api`)"
      - "traefik.http.routers.power-clean-api.entrypoints=websecure"
      - "traefik.http.routers.power-clean-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.power-clean-api.priority=30"
      - "traefik.http.services.power-clean-api.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Definiert, dass das Netzwerk "traefik-proxy" bereits existiert und nicht neu erstellt werden soll
networks:
  traefik-proxy:
    external: true
