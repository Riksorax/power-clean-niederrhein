name: Build, Push, and Deploy Power Clean Niederrhein

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/PowerClean.Api
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/power-clean-api:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/power-clean-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://powercleanniederrhein.de

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Nur die docker-compose.yaml landet auf dem Server - kein Git-Checkout des ganzen Repos
      # mehr nötig, die Container laufen ohnehin von den fertig gebauten Images aus Docker Hub.
      - name: docker-compose.yaml auf Server kopieren
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          source: docker-compose.yaml
          target: projekte/${{ github.event.repository.name }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "$HOME/projekte/${{ github.event.repository.name }}"

            sudo sh -c '
              export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}";
              export SMTP_HOST="${{ secrets.SMTP_HOST }}";
              export SMTP_PORT="${{ secrets.SMTP_PORT }}";
              export SMTP_USERNAME="${{ secrets.SMTP_USERNAME }}";
              export SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}";
              export SMTP_FROM_EMAIL="${{ secrets.SMTP_FROM_EMAIL }}";
              export SMTP_TO_EMAIL="${{ secrets.SMTP_TO_EMAIL }}";
              export UNIVERSALCMS_API_KEY="${{ secrets.UNIVERSALCMS_API_KEY }}";
              export REVALIDATE_SECRET="${{ secrets.REVALIDATE_SECRET }}";
              docker compose --file docker-compose.yaml pull
              docker compose --file docker-compose.yaml up -d --remove-orphans
            '

            # Alte, ungenutzte Docker-Images aufräumen
            sudo docker image prune -af

            # Beim Docker-Build ist das Backend nicht erreichbar (kein laufender api-Container in
            # der isolierten Build-Umgebung) - die statisch vorgerenderte Startseite hat direkt nach
            # jedem Deploy deshalb einen leeren Datenstand, bis er einmal revalidiert wird. Das hier
            # übernimmt automatisch, was sonst manuell nachgeholt werden müsste.
            #
            # Fixe sleeps reichten nicht - der neu gestartete Next.js-Container antwortet nicht
            # zuverlässig innerhalb von 5s (siehe "Connection refused" in einem früheren Lauf),
            # deshalb hier eine Warteschleife bis der Server tatsächlich antwortet.
            for i in $(seq 1 15); do
              docker exec power-clean-frontend wget -qO- http://127.0.0.1:3000/ > /dev/null 2>&1 && break
              sleep 2
            done

            docker exec power-clean-frontend wget -qO- \
              --header "x-revalidate-secret: ${{ secrets.REVALIDATE_SECRET }}" \
              --header "Content-Type: application/json" \
              --post-data '{"tag":"all"}' \
              http://127.0.0.1:3000/revalidate || true

            # revalidateTag markiert nur als veraltet - die eigentliche Neu-Generierung läuft erst
            # beim nächsten Request (stale-while-revalidate). Zwei Nachfass-Anfragen, damit die
            # Seite für den ersten echten Besucher nach dem Deploy schon frisch ist.
            sleep 2
            docker exec power-clean-frontend wget -qO- http://127.0.0.1:3000/ > /dev/null || true
            sleep 2
            docker exec power-clean-frontend wget -qO- http://127.0.0.1:3000/ > /dev/null || true
